# =====================================================================
# FeatureDataset 标准配置模板
# 对应类: ser_lib.dataset.feature_dataset.FeatureDataset
#
# 任务定位:
#   - 从原始音频提取多个 frame-level 特征
#   - 以字典形式返回各特征，不在 Dataset 内部做拼接
#   - 适用于多特征融合模型、自定义时序建模模型
#
# 当前单样本输出:
#   ({"f0": Tensor[T] 或 Tensor[D, T], ...}, label, seq_length)
#
# 当前框架边界:
#   - 只推荐使用具备统一时间轴的 frame-level 特征
#   - 当前不支持 FeatureDataset + sliding_window
#
# 配置隔离规则:
#   - [必填] 必须包含 features 节点
#   - [必填] 不得包含 spectrogram 节点
# =====================================================================

# ---------------------------------------------------------------------
# 1. 数据集元数据
# ---------------------------------------------------------------------

# [必填] 数据集名称
dataset_name: "my_feature_dataset"

# [必填] 类别总数
num_classes: 6

# [必填] 类别映射
class_mapping:
  0: { en: "Neutral", zh: "平静" }
  1: { en: "Happy", zh: "高兴" }
  2: { en: "Angry", zh: "愤怒" }
  3: { en: "Sad", zh: "悲伤" }
  4: { en: "Surprise", zh: "惊讶" }
  5: { en: "Fear", zh: "恐惧" }

# ---------------------------------------------------------------------
# 2. 路径与数据列表配置
# ---------------------------------------------------------------------

# [可选] 路径配置
paths:
  metadata_dir: "./data/my_dataset/metadata"
  data_root_dir: "./data/my_dataset/audio"

# [必填] 三个数据列表
data_lists:
  train: "train.jsonl"
  val: "val.jsonl"
  test: "test.jsonl"

# ---------------------------------------------------------------------
# 3. 音频基础参数
# ---------------------------------------------------------------------

audio:
  # [可选] 统一重采样目标采样率
  # Schema 默认值: 16000
  target_sr: 16000

# ---------------------------------------------------------------------
# 4. 批处理策略
# ---------------------------------------------------------------------

# FeatureDataset 返回多特征字典
# 推荐默认策略:
#   - dynamic_mask: 首选
#   - truncate_pad: 在需要固定长度输入时使用
#   - sliding_window: 当前不支持

audio_processing:
  # [可选] 批处理策略
  # 可选值:
  #   - dynamic_mask : 输出各特征 [B, T_max, D] + mask
  #   - truncate_pad : 输出各特征 [B, T_fixed, D]
  # Schema 默认值: truncate_pad
  strategy: "dynamic_mask"

  # [可选] truncate_pad 专用
  # Schema 默认值: 300
  max_frames: 300

  # [可选] 仅为统一配置结构保留；当前 FeatureDataset 不支持 sliding_window
  # Schema 默认值: 300
  window_size: 300

  # [可选] 仅为统一配置结构保留；当前 FeatureDataset 不支持 sliding_window
  # Schema 默认值: 150
  stride: 150

# ---------------------------------------------------------------------
# 5. 多特征配置
# ---------------------------------------------------------------------

features:
  # [必填] 所有待提取特征
  selected_features:
    # --------------------------------------------------------------
    # 5.1 韵律特征
    # --------------------------------------------------------------

    # [可选] 基频 F0
    f0:
      # [必填] 特征类型
      type: "F0"
      kwargs:
        # [可选] 帧移
        # 实现默认值: 依赖具体提取器实现，建议显式填写
        hop_length: 256

    # [可选] 短时能量 RMS
    rms:
      type: "RMS"
      kwargs:
        # 实现默认值: 依赖具体提取器实现，建议显式填写
        win_length: 400
        hop_length: 256

    # [可选] 过零率 ZCR
    zcr:
      type: "ZCR"
      kwargs:
        # 实现默认值: 依赖具体提取器实现，建议显式填写
        win_length: 400
        hop_length: 256

    # --------------------------------------------------------------
    # 5.2 频域特征
    # --------------------------------------------------------------

    # [可选] 谱质心
    spectral_centroid:
      type: "SpectralCentroid"
      kwargs:
        # 实现默认值: 依赖具体提取器实现，建议显式填写
        n_fft: 1024
        hop_length: 256

    # [可选] 谱滚降
    spectral_rolloff:
      type: "SpectralRolloff"
      kwargs:
        # 实现默认值: 依赖具体提取器实现，建议显式填写
        n_fft: 1024
        hop_length: 256
        roll_percent: 0.85

    # [可选] 谱平坦度
    spectral_flatness:
      type: "SpectralFlatness"
      kwargs:
        # 实现默认值: 依赖具体提取器实现，建议显式填写
        n_fft: 1024
        hop_length: 256

    # [可选] 谱通量
    spectral_flux:
      type: "SpectralFlux"
      kwargs:
        # 实现默认值: 依赖具体提取器实现，建议显式填写
        n_fft: 1024
        hop_length: 256

    # --------------------------------------------------------------
    # 5.3 其它可选特征示例
    # --------------------------------------------------------------

    # [可选] MFCC
    # mfcc:
    #   type: "MFCC"
    #   kwargs:
    #     n_mfcc: 40
    #     n_fft: 1024
    #     hop_length: 256
    #     n_mels: 80

    # [可选] Delta 特征
    # 注意: Delta 通常更适合配合已有时序矩阵特征使用
    # delta:
    #   type: "Delta"
    #   kwargs:
    #     win_length: 5

    # [可选] Jitter/Shimmer/HNR
    # 注意: 当前实现仍有额外依赖关系，不建议作为默认模板直接启用
    # jitter_shimmer_hnr:
    #   type: "JitterShimmerHNR"

# ---------------------------------------------------------------------
# 6. 数据增强配置
# ---------------------------------------------------------------------

transforms:
  # ================================================================
  # 6.1 波形级基础增强
  # ================================================================
  waveform_level:
    train:
      # 实现说明: p 不适用
      - type: "Normalize"

      # Schema 默认值: p=0.5
      - type: "AddGaussianNoise"
        snr: 18.0
        p: 0.5

      # Schema 默认值: p=0.5
      - type: "TimeShift"
        shift_max_ratio: 0.15
        p: 0.3

      # Schema 默认值: p=0.5
      - type: "VolumeScale"
        gain_min: 0.75
        gain_max: 1.25
        p: 0.4

    val: []
    test: []

  # ================================================================
  # 6.2 波形级高级增强
  # ================================================================
  advanced_waveform_level:
    train:
      # Schema 默认值: p=0.5
      - type: "PitchShift"
        n_steps: 2
        p: 0.3

      # Schema 默认值: p=0.5
      - type: "TimeStretch"
        rate: 1.1
        p: 0.3

      # - type: "DynamicSNRMixing"
      #   noise_dataset_path: "./data/musan"
      #   p: 0.3

    val: []
    test: []

  # ================================================================
  # 6.3 频域增强
  # ================================================================
  spectrogram_level:
    # [可选] FeatureDataset 默认不使用，建议保留为空
    train: []
    val: []
    test: []

  # ================================================================
  # 6.4 批次级增强
  # ================================================================
  batch_level:
    train:
      # - type: "Mixup"
      #   # Schema 默认值: p=0.5
      #   alpha: 0.2
      #   p: 0.5
    val: []
    test: []
