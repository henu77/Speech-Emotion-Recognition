dataset_name: CASIA
num_classes: 6
class_mapping:
  0:
    en: Neutral
    zh: 平静
  1:
    en: Happy
    zh: 高兴
  2:
    en: Angry
    zh: 愤怒
  3:
    en: Sad
    zh: 悲伤
  4:
    en: Surprise
    zh: 惊吓
  5:
    en: Fear
    zh: 恐惧
paths:
  metadata_dir: ser_lib/dataset/configs/casia
  data_root_dir: data/CASIA
data_lists:
  train: train.jsonl
  val: val.jsonl
  test: test.jsonl
audio:
  target_sr: 16000
audio_processing:
  strategy: dynamic_mask
  max_frames: 200
  window_size: 300
  stride: 150
transforms:
  waveform_level:
    train: []
    val: []
    test: []
  advanced_waveform_level:
    train: []
    val: []
    test: []
  spectrogram_level:
    train: []
    val: []
    test: []
  batch_level:
    train: []
    val: []
    test: []
features:
  selected_features:
    f0:
      type: F0
      kwargs:
        hop_length: 256
    rms:
      type: RMS
      kwargs:
        win_length: 400
        hop_length: 256
    zcr:
      type: ZCR
      kwargs:
        win_length: 400
        hop_length: 256
    spectral_centroid:
      type: SpectralCentroid
      kwargs:
        n_fft: 1024
        hop_length: 256
