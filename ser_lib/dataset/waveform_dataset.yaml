# =====================================================================
# WaveformDataset 标准配置模板
# 对应类: ser_lib.dataset.waveform_dataset.WaveformDataset
#
# 任务定位:
#   - 直接返回原始波形，不做谱图或手工特征提取
#   - 适用于 Wav2Vec2、HuBERT、RawNet 等端到端波形模型
#
# 当前单样本输出:
#   ({"raw_waveform": Tensor[T]}, label, seq_length)
#
# 当前 batch 输出由 collate_fn 统一组装为:
#   {
#     "inputs": {"raw_waveform": ...},
#     "labels": Tensor[B] 或 Tensor[B_expanded],
#     "lengths": Tensor[B] 或 Tensor[B_expanded],
#     "mask": Tensor[...] 或 None,
#     "meta": {...}
#   }
#
# 配置隔离规则:
#   - [必填] 不得包含 spectrogram 节点
#   - [必填] 不得包含 features 节点
# =====================================================================

# ---------------------------------------------------------------------
# 1. 数据集元数据
# ---------------------------------------------------------------------

# [必填] 数据集名称，仅用于配置识别、日志打印与实验记录
dataset_name: "my_waveform_dataset"

# [必填] 类别总数，必须与 class_mapping 的条目数严格一致
num_classes: 6

# [必填] 类别映射表
# 要求:
#   - key 必须从 0 开始连续递增
#   - 条目数量必须等于 num_classes
#   - en / zh 都是必填
class_mapping:
  0: { en: "Neutral", zh: "平静" }
  1: { en: "Happy", zh: "高兴" }
  2: { en: "Angry", zh: "愤怒" }
  3: { en: "Sad", zh: "悲伤" }
  4: { en: "Surprise", zh: "惊讶" }
  5: { en: "Fear", zh: "恐惧" }

# ---------------------------------------------------------------------
# 2. 路径与数据列表配置
# ---------------------------------------------------------------------

# [可选] 路径相关配置
# 使用建议:
#   - metadata_dir: 当 train/val/test 使用相对路径时，通常建议填写
#   - data_root_dir: 当 JSONL 中 audio_path 为相对路径时，通常建议填写
paths:
  # [可选] 元数据目录；若 data_lists 中写的是相对路径，会自动与此目录拼接
  metadata_dir: "./data/my_dataset/metadata"

  # [可选] 音频根目录；若样本中的 audio_path 为相对路径，会自动与此目录拼接
  data_root_dir: "./data/my_dataset/audio"

# [必填] 三个数据划分对应的数据列表
# 支持 .json 或 .jsonl
data_lists:
  # [必填] 训练集列表文件
  train: "train.jsonl"

  # [必填] 验证集列表文件
  val: "val.jsonl"

  # [必填] 测试集列表文件
  test: "test.jsonl"

# 推荐的 JSONL 单条样本格式:
# {"audio_path": "speaker_01/0001.wav", "label": 0}
# 可选附加字段:
#   - sample_rate / sr
#   - start_time_ms
#   - end_time_ms

# ---------------------------------------------------------------------
# 3. 音频基础参数
# ---------------------------------------------------------------------

audio:
  # [可选] 目标采样率；所有音频会被统一重采样到该采样率
  # 合法范围: [8000, 48000]
  # Schema 默认值: 16000
  target_sr: 16000

# ---------------------------------------------------------------------
# 4. 批处理策略
# ---------------------------------------------------------------------

# WaveformDataset 返回 1D 序列 [T]
# 推荐默认策略:
#   - 训练: dynamic_mask
#   - 长音频评估: sliding_window
#   - 固定窗口训练/部署对齐: truncate_pad

audio_processing:
  # [可选] 批处理对齐策略
  # 可选值:
  #   - truncate_pad  : 补零/截断到固定长度，输出 raw_waveform -> [B, T_fixed]
  #   - dynamic_mask  : 动态补齐到 batch 内最长长度，输出 raw_waveform -> [B, T_max] 并返回 mask
  #   - sliding_window: 按窗口展开长音频，输出 raw_waveform -> [B_expanded, T_window]
  # Schema 默认值: truncate_pad
  strategy: "dynamic_mask"

  # [可选] truncate_pad 专用
  # 含义: 固定长度采样点数
  # 示例: 16kHz * 4s = 64000
  # Schema 默认值: 300
  max_frames: 64000

  # [可选] sliding_window 专用
  # 含义: 每个滑窗的采样点数
  # Schema 默认值: 300
  window_size: 64000

  # [可选] sliding_window 专用
  # 含义: 滑窗步长；必须 <= window_size
  # Schema 默认值: 150
  stride: 32000

# ---------------------------------------------------------------------
# 5. 数据增强配置
# ---------------------------------------------------------------------

# WaveformDataset 只真正使用:
#   - waveform_level
#   - advanced_waveform_level
#
# 其余两组字段为了统一配置结构仍可保留:
#   - spectrogram_level
#   - batch_level

transforms:
  # ================================================================
  # 5.1 波形级基础增强
  # ================================================================
  waveform_level:
    # [可选] 训练集增强列表；不需要增强时填 []
    train:
      # 示例 1: 波形标准化
      # [可选] 无额外参数
      # 实现说明: p 不适用
      - type: "Normalize"

      # 示例 2: 高斯噪声注入
      # [可选] 但一旦启用该增强，snr 为必填
      # Schema 默认值: p=0.5
      - type: "AddGaussianNoise"
        snr: 15.0
        p: 0.5

      # 示例 3: 时间平移
      # Schema 默认值: p=0.5
      - type: "TimeShift"
        shift_max_ratio: 0.2
        p: 0.3

      # 示例 4: 音量缩放
      # Schema 默认值: p=0.5
      - type: "VolumeScale"
        gain_min: 0.7
        gain_max: 1.3
        p: 0.4

    # [可选] 验证集增强列表；通常建议留空
    val: []

    # [可选] 测试集增强列表；通常建议留空
    test: []

  # ================================================================
  # 5.2 波形级高级增强
  # ================================================================
  advanced_waveform_level:
    # [可选]
    train:
      # 示例 1: 音调偏移
      # Schema 默认值: p=0.5
      - type: "PitchShift"
        n_steps: 2
        p: 0.3

      # 示例 2: 时间拉伸
      # Schema 默认值: p=0.5
      - type: "TimeStretch"
        rate: 1.1
        p: 0.3

      # 示例 3: 房间冲激响应混响
      # 说明: 当前代码仍为占位实现，启用前需确认对应逻辑已完成
      # - type: "RIR_Simulation"
      #   rir_path: "./data/rir/room_impulse_response.wav"
      #   p: 0.3

      # 示例 4: 动态背景噪声混合
      # 说明: 当前代码仍为占位实现，启用前需确认对应逻辑已完成
      # - type: "DynamicSNRMixing"
      #   noise_dataset_path: "./data/musan"
      #   p: 0.3

    # [可选]
    val: []

    # [可选]
    test: []

  # ================================================================
  # 5.3 频域增强
  # ================================================================
  spectrogram_level:
    # [可选] WaveformDataset 不使用，建议保留为空
    train: []
    val: []
    test: []

  # ================================================================
  # 5.4 批次级增强
  # ================================================================
  batch_level:
    # [可选] 当前 Mixup 仍未正式接入训练主链路时建议留空
    train:
      # - type: "Mixup"
      #   # Schema 默认值: p=0.5
      #   alpha: 0.2
      #   p: 0.5
    val: []
    test: []
