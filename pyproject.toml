[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ser-lib"
version = "0.2.0"
description = "Speech Emotion Recognition library: data pipeline, models and inference"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SER contributors" }]
dependencies = [
    "torch>=2.0",
    "torchaudio>=2.0",
    "pydantic>=2.5",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4",
]
desktop = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[tool.setuptools.packages.find]
include = ["ser_lib*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning:torchaudio.*",
]
