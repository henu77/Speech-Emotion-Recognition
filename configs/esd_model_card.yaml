description: ESD 中英双语五分类 CNN + Log-Mel 研究基线。
intended_use: 验证双语、多说话人 SER 的训练、评估和 Artifact 工作流。
dataset: ESD，默认按语言分层并按说话人划分训练、验证和测试集。
language: [zh, en]
license: 使用者必须依据 ESD 官方发布条款确认数据和衍生模型的许可。
limitations:
  - 数据为表演型情感语音，不能代表所有自然会话场景。
  - 说话人独立划分与 ESD 官方语音合成划分用途不同，不应混合比较结果。
  - 该轻量 CNN 是工程基线，不应直接用于高风险决策。
