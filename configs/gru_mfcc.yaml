schema_version: 1
data:
  schema_version: 1
  manifest: ../data/standard/dataset.yaml
  labels:
    0: {en: neutral, zh: 中性}
    1: {en: happy, zh: 高兴}
    2: {en: sad, zh: 悲伤}
    3: {en: angry, zh: 愤怒}
    4: {en: fearful, zh: 恐惧}
    5: {en: surprised, zh: 惊讶}
  audio: {target_sample_rate: 16000, mono: true, normalize_peak: false}
  representation:
    type: mfcc
    params: {sample_rate: 16000, n_fft: 400, win_length: 400, hop_length: 160, n_mels: 64, n_mfcc: 40}
  waveform_transforms:
    - {type: gaussian_noise, params: {snr_db: 20.0}, probability: 0.3}
  batching: {type: dynamic}
model:
  type: gru_baseline
  params: {feature_dim: 40, num_classes: 6, hidden_dim: 128, num_layers: 2, bidirectional: true, dropout: 0.2}
trainer:
  epochs: 30
  device: cpu
  seed: 42
  deterministic: true
  amp: false
  gradient_clip_norm: 5.0
  monitor: val_uar
  early_stopping_patience: 7
  early_stopping_min_delta: 0.001
optimizer:
  type: adamw
  params: {learning_rate: 0.001, weight_decay: 0.0001}
scheduler:
  type: cosine
  params: {t_max: 30}
loss:
  type: focal
  focal_gamma: 2.0
sampling:
  type: weighted
output_dir: ../runs/gru-mfcc
