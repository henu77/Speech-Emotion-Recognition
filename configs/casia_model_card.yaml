description: 使用 CASIA 四说话人语料训练的 CNN + Log-Mel 六分类基线。
intended_use: SER 数据流水线、训练、Artifact 和跨说话人评估的研究演示。
dataset: CASIA，2 位说话人训练、1 位验证、1 位测试；共 1200 条音频。
language: [zh]
license: 请使用者依据其获得 CASIA 数据的来源确认数据许可；本仓库不分发原始音频。
limitations:
  - 仅使用四位说话人的朗读语音，不能代表真实开放场景。
  - 测试集为单一说话人，结果方差较大，不应视为通用性能结论。
  - 模型可能学习说话人、录音条件和固定文本等数据集特征。
  - 仅供研究和流水线验证，不应用于高风险决策。
